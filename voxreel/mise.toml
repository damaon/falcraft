[tools]
rust = "1.91"
node = "24"

[tasks.build]
run = "cargo build --release"

[tasks.test]
run = "cargo test --release"

[tasks.demo]
description = "Render the bundled example build (no API key needed)"
run = "cargo run --release -- render examples/lighthouse.json -o out/lighthouse.mp4"

[tasks.battle]
description = "AI build battle: mise run battle -- \"a capybara in a hot spring\""
run = "cargo run --release -- battle"

[tasks.web]
description = "Dev server for the build gallery website"
dir = "web"
run = "npm run dev"

[tasks.export]
description = "Minecraft downloads (Java + Bedrock) for every build into web/static/downloads"
run = "cargo run --release -- export builds -o web/static/downloads"

[tasks.deploy]
description = "Export Minecraft downloads, build the website and deploy it to Cloudflare"
depends = ["export"]
dir = "web"
run = "npm run build && npx wrangler@4 deploy"
