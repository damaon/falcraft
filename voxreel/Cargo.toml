[package]
name = "voxreel"
version = "0.1.0"
edition = "2021"
description = "Renders satisfying voxel build videos (9:16 shorts), incl. AI build battles via OpenRouter"

[dependencies]
anyhow = "1"
bytemuck = { version = "1.16", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fontdue = "0.9"
glam = "0.29"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
wgpu = "25"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = false
lto = "thin"
